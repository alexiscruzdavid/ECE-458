name: Build and Deploy Docker

on:
  push:
    branches:
      - dev-server
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout the code
    - name: Checkout Code
      uses: actions/checkout@v3

    # Build the Docker image
    - name: Build Docker Image
      run: |
        IMAGE_NAME="my-app"
        DATE_TAG=$(date +%Y%m%d-%H%M%S)
        docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:$DATE_TAG .

    # Save SSH key and configure SSH
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
        ls -la ~/.ssh
        cd ~/.ssh/
        pwd

    - name: Test SSH key file    
      run: |
        cat /home/runner/.ssh/id_rsa 
#test


    - name: Test SSH Connection
      run: |
        ssh -v -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} echo "SSH Connection Successful"
      
    # Push the image to the remote server
    - name: Deploy Docker Container to Remote Server
      env:
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SERVER_IP: ${{ secrets.SERVER_IP }}
        IMAGE_NAME: "my-app"
      run: |
        DATE_TAG=$(date +%Y%m%d-%H%M%S)
        REMOTE_DIR="/home/$SERVER_USER/deployments"
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP <<EOF
          # Ensure the directory exists
          mkdir -p $REMOTE_DIR

          # Save the image locally on the server
          docker save $IMAGE_NAME:$DATE_TAG | gzip > $REMOTE_DIR/$IMAGE_NAME-$DATE_TAG.tar.gz

          # Stop and remove the current container if it exists
          docker stop $IMAGE_NAME || true
          docker rm $IMAGE_NAME || true

          # Load and start the new container
          docker load < $REMOTE_DIR/$IMAGE_NAME-$DATE_TAG.tar.gz
          docker run -d --name $IMAGE_NAME $IMAGE_NAME:$DATE_TAG

          # Prune older images to save space
          docker image prune -f --filter "until=24h"
        EOF
